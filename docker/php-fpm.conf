[www]
; Varios procesos atienden peticiones a la vez (el servidor integrado de PHP atendía una por una)
pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 500
request_terminate_timeout = 120s
; Las variables del contenedor (APP_KEY, DB_*, ...) deben llegar a PHP
clear_env = no
catch_workers_output = yes
php_admin_value[memory_limit] = 512M
